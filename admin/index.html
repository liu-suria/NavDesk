<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NavDesk · 管理</title><link rel="stylesheet" href="/style.css?v=4" /><link rel="stylesheet" href="/admin/admin.css?v=4" />
</head>
<body class="admin-shell">
  <header class="admin-topbar"><a class="brand" href="/"><span class="brand-mark">N</span><span>NavDesk</span></a><div class="admin-actions"><a class="back-link" href="/">↗ 查看导航</a><button class="minor-button" id="themeButton">◐</button><button class="minor-button" id="logoutButton">退出</button></div></header>
  <main class="admin-main" id="adminApp" hidden>
    <section class="admin-hero"><div><p class="eyebrow">NAVIGATION MANAGEMENT</p><h1>管理你的入口</h1><p>按场景分好组，把常用服务安静地放在这里。</p></div><button class="primary add-link" id="addLinkButton">+ 新建链接</button></section>
    <section class="toolbar"><div><strong id="summary">0 个分组 · 0 个链接</strong><span>所有修改会立即保存到私有存储</span></div><div class="toolbar-actions"><button class="minor-button" id="importButton">导入 JSON</button><button class="minor-button" id="exportButton">导出备份</button><button class="minor-button" id="addGroupButton">+ 新建分组</button><input id="fileInput" type="file" accept="application/json" hidden /></div></section>
    <div id="groups" class="admin-groups"></div>
  </main>
  <section class="login-screen" id="loginScreen" hidden><div class="login-card"><span class="brand-mark large">N</span><p class="eyebrow">PRIVATE ADMIN</p><h1>管理入口</h1><p>输入密码后管理你的导航和分组。</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required /><button class="primary" type="submit">进入管理台 <span>→</span></button><p class="form-message" id="loginMessage"></p></form></div></section>
  <dialog id="editor"><form method="dialog" id="editorForm" class="modal"><header><div><p class="eyebrow" id="modalEyebrow">NEW LINK</p><h2 id="modalTitle">新建链接</h2></div><button class="close" value="cancel" aria-label="关闭">×</button></header><div id="editorFields"></div><footer><button class="minor-button" value="cancel">取消</button><button class="primary" id="saveButton" value="default">保存</button></footer></form></dialog>
  <template id="groupTemplate"><section class="manage-group"><header class="manage-group-head"><div class="group-label"><span class="group-icon"></span><strong class="group-name"></strong><span class="link-count"></span></div><div class="row-actions"><button data-action="edit-group">编辑</button><button data-action="move-up">↑</button><button data-action="move-down">↓</button><button data-action="remove-group" class="danger">删除</button></div></header><div class="link-table"><div class="link-table-head"><span>名称</span><span>地址</span><span>备注</span><span>操作</span></div><div class="link-rows"></div></div><button class="add-in-group" data-action="add-link">+ 添加链接</button></section></template>
  <template id="linkTemplate"><article class="link-row"><div class="link-name"><span class="site-icon"></span><strong></strong></div><a class="link-url" target="_blank" rel="noreferrer"></a><p class="link-description"></p><div class="row-actions"><button data-action="edit-link">编辑</button><button data-action="move-link-up">↑</button><button data-action="move-link-down">↓</button><button data-action="remove-link" class="danger">删除</button></div></article></template>
  <script src="/admin/app.js?v=4" defer></script>
</body>
</html>
