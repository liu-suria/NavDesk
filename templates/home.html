<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fbf7f8" />
  <!-- BOOT -->
  <!-- STYLE -->
  <title>NavDesk · 个人导航</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />

</head>
<body class="app-shell">
  <main class="container" id="app">
    <header class="topbar">
      <strong id="siteTitle" class="site-title">NavDesk</strong>
      <button type="button" id="calendarButton" class="browser-clock" aria-label="日期：打开日历" aria-haspopup="dialog"><time id="clock"><span id="clockDate"></span><span id="clockLunar"></span></time></button>
      <form class="web-search" id="webSearchForm" role="search">
        <label class="sr-only" for="searchEngine">搜索引擎</label>
        <select id="searchEngine" aria-label="选择搜索引擎">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="baidu">百度</option>
          <option value="duckduckgo">DuckDuckGo</option>
        </select>
        <input id="searchInput" type="search" autocomplete="off" placeholder="搜索收藏的网址…" aria-label="搜索关键词" />
        <button type="submit" aria-label="搜索">⌕</button>
      </form>
      <button type="button" id="timeButton" class="browser-clock" aria-label="时间：打开日历" aria-haspopup="dialog"><time id="clockTime"></time></button>
      <div class="top-actions"><button type="button" class="icon-button desktop-only" id="manageNav" title="新增网址、调整顺序与导航管理" aria-label="导航设置">⚙ 设置</button><button class="icon-button" id="themeButton" title="切换主题">◐</button></div>
    </header>
    <div class="boot-screen" id="bootScreen" role="status"><span class="brand-mark">N</span><span id="bootMessage">正在打开导航…</span><button class="icon-button" id="retryButton" hidden>重新加载</button></div>
    <div id="localSearchStatus" class="search-status" hidden><span id="localSearchCount"></span><button id="clearLocalSearch" type="button">清空</button><button id="searchWeb" type="button">搜索互联网 ↗</button></div>
    <div id="workspaceTabs" class="workspace-tabs" role="tablist" aria-label="工作空间"><button class="icon-button" id="navigationTab" role="tab" aria-selected="true" aria-controls="navigationPanel" data-view="navigation">网址导航</button><button class="icon-button" id="familyTab" role="tab" aria-selected="false" aria-controls="familyPanel" data-view="family">家庭事务</button></div>
    <div class="workspace-layout">
      <aside class="category-rail" id="categoryRail" aria-label="分类快速跳转"></aside>
      <div class="navigation-column" id="navigationPanel" aria-labelledby="navigationTab">
        <section id="pinnedSection" class="nav-group pinned-section" hidden><div class="group-heading"><span class="group-icon">★</span><h2>常用置顶</h2><span class="count" id="pinnedCount"></span></div><div id="pinnedCards" class="cards"></div></section>
        <section id="navigation" class="navigation" aria-live="polite"></section>
      </div>
      <aside id="familyPanel" class="family-panel" aria-label="家庭事务" aria-labelledby="familyTab"><div class="family-placeholder">家庭事务<span>稍后加载</span></div></aside>
    </div>
  </main>
  <section class="login-screen" id="loginScreen" hidden>
    <div class="login-card"><span class="brand-mark large" id="loginBrandMark">N</span><p class="eyebrow">PRIVATE NAVIGATION</p><h1>你的个人导航台</h1><p>输入密码，进入仅属于你的工作空间。</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required /><button class="primary" type="submit">进入 <span id="loginBrandName">NavDesk</span> <span>→</span></button><p class="form-message" id="loginMessage"></p></form></div>
  </section>
  <template id="groupTemplate"><section class="nav-group"><div class="group-heading"><span class="group-icon"></span><h2></h2><span class="count"></span></div><div class="cards"></div></section></template>
  <p id="pageMessage" class="page-message" role="status" hidden></p>
  <button id="backToTop" class="back-to-top" aria-label="回到顶部" hidden>↑</button>
  <!-- APP -->
<noscript><p>请启用 JavaScript 以登录并读取私有导航。</p></noscript>
</body>
</html>
