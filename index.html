  <script>// Start the authenticated data request while the static page is still parsing.
window.navdeskBoot = (() => {
  const read = (key, fallback = null) => { try { return localStorage.getItem(key) ?? fallback; } catch { return fallback; } };
  const write = (key, value) => { try { localStorage.setItem(key, value); } catch {} };
  document.documentElement.dataset.theme = read('navdesk-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  async function request(url, options = {}) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000);
    try {
      const response = await fetch(url, { credentials: 'same-origin', cache: 'no-store', ...options, signal: controller.signal });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(response.status === 401 ? '登录已失效，请重新输入密码。' : data.error || `请求失败 (${response.status})`);
        error.status = response.status;
        throw error;
      }
      return data;
    } catch (error) {
      if (error.name === 'AbortError') throw new Error('请求超时，请稍后重试。');
      throw error;
    } finally { clearTimeout(timeout); }
  }
  // Handle rejection immediately, including failures before the page script runs.
  const navigation = request('/api/navigation').then(data => ({ data }), error => ({ error }));
  return { read, write, request, navigation };
})();
</script>

block !important;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px;}.top-actions{margin-left:auto;}.admin-link{height:32px;padding:0 10px;}.web-search{position:static;order:3;flex:0 0 100%;max-width:none;height:54px;border-radius:16px;box-shadow:0 7px 22px rgba(106,69,83,0.07);}.web-search select{max-width:115px;padding-left:13px;font-size:14px;}.web-search input{padding-inline:14px;font-size:15px;}.web-search button{width:52px;font-size:31px;}.workspace-layout{display:block;margin-top:0;}.category-rail{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-height:none;overflow:visible;padding:10px 0 11px;background:var(--bg);}.category-rail a{flex:0 0 auto;min-height:38px;padding:7px 11px;gap:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;}.category-rail a span{width:22px;height:22px;flex-basis:22px;font-size:11px;}.navigation{gap:12px;}.nav-group{scroll-margin-top:115px;}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}.nav-card{min-height:64px;padding:9px;}.card-copy strong{font-size:12px;}.card-copy small{display:none;}}body{background:radial-gradient(ellipse at top left,rgba(229,162,181,.08),transparent 65%),var(--bg)}.boot-screen{min-height:180px;padding:32px 0}.boot-screen:not([hidden]) ~ .workspace-layout{display:none}.site-icon{position:relative}.site-icon img{position:absolute}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}@media(max-width:650px){.icon-button,.admin-link{min-width:44px;min-height:44px}.web-search input,.web-search select,.login-card input{font-size:16px}.topbar{backdrop-filter:none}}</style>
  <title>NavDesk · 个人导航</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
  <link rel="manifest" href="/site.webmanifest" />

</head>
<body class="app-shell">
  <main class="container" id="app">
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark" id="brandMark">N</span><span id="brandName">NavDesk</span></a>
      <form class="web-search" id="webSearchForm" role="search">
        <label class="sr-only" for="searchEngine">搜索引擎</label>
        <select id="searchEngine" aria-label="选择搜索引擎">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
          <option value="baidu">百度</option>
          <option value="duckduckgo">DuckDuckGo</option>
        </select>
        <input id="searchInput" type="search" autocomplete="off" placeholder="搜索互联网…" aria-label="搜索关键词" />
        <button type="submit" aria-label="搜索">⌕</button>
      </form>
      <div class="top-actions"><span id="clock" class="clock"></span><button class="icon-button" id="themeButton" title="切换主题">◐</button><a class="admin-link" href="/admin/">管理</a></div>
    </header>
    <div class="boot-screen" id="bootScreen" role="status"><span class="brand-mark">N</span><span id="bootMessage">正在打开导航…</span><button class="icon-button" id="retryButton" hidden>重新加载</button></div>
    <div class="workspace-layout">
      <aside class="category-rail" id="categoryRail" aria-label="分类快速跳转"></aside>
      <section id="navigation" class="navigation" aria-live="polite"></section>
    </div>
  </main>
  <section class="login-screen" id="loginScreen" hidden>
    <div class="login-card"><span class="brand-mark large" id="loginBrandMark">N</span><p class="eyebrow">PRIVATE NAVIGATION</p><h1>你的个人导航台</h1><p>输入密码，进入仅属于你的工作空间。</p><form id="loginForm"><input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" required /><button class="primary" type="submit">进入 <span id="loginBrandName">NavDesk</span> <span>→</span></button><p class="form-message" id="loginMessage"></p></form></div>
  </section>
  <template id="groupTemplate"><section class="nav-group"><div class="group-heading"><span class="group-icon"></span><h2></h2><span class="count"></span></div><div class="cards"></div></section></template>
  <script>const $ = (selector, root = document) => root.querySelector(selector);
const app = $("#app"), loginScreen = $("#loginScreen"), navigation = $("#navigation"), categoryRail = $("#categoryRail");
const bootScreen = $("#bootScreen");
const { read, write, request } = window.navdeskBoot;
const clockFormat = new Intl.DateTimeFormat("zh-CN", { month: "long", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit" });

function escapeHtml(value) { return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char])); }
function hostname(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; } }
function formatClock() { $("#clock").textContent = clockFormat.format(new Date()).replace("星期", "周"); }
function setTheme(theme) { document.documentElement.dataset.theme = theme; write("navdesk-theme", theme); }

const searchUrls = {
  google: "https://www.google.com/search?q=",
  bing: "https://www.bing.com/search?q=",
  baidu: "https://www.baidu.com/s?wd=",
  duckduckgo: "https://duckduckgo.com/?q=",
};

function setBrand(settings = {}) {
  const name = String(settings.brandName || "NavDesk").trim() || "NavDesk";
  const mark = [...name][0]?.toUpperCase() || "N";
  document.title = `${name} · 个人导航`;
  $("#brandName").textContent = name;
  const loginBrandName = $("#loginBrandName");
  if (loginBrandName) loginBrandName.textContent = name;
  $("#brandMark").textContent = mark;
  $("#loginBrandMark").textContent = mark;
}

function render(data) {
  const groupFragment = document.createDocumentFragment();
  const railFragment = document.createDocumentFragment();
  let visibleGroups = 0;
  data.groups.forEach((group) => {
    const links = group.links;
    if (!links.length) return;
    visibleGroups += 1;
    const node = $("#groupTemplate").content.firstElementChild.cloneNode(true);
    const groupId = `group-${group.id || visibleGroups}`;
    node.id = groupId;
    $(".group-icon", node).textContent = group.icon || "◆";
    $(".group-icon", node).style.background = `${group.color}22`;
    $(".group-icon", node).style.color = group.color;
    $("h2", node).textContent = group.name; $(".count", node).textContent = String(links.length).padStart(2, "0");
    const cards = $(".cards", node);
    links.forEach((link) => {
      const a = document.createElement("a"); a.className = "nav-card"; a.href = link.url; a.target = link.openInNew ? "_blank" : "_self"; a.rel = "noreferrer";
      const icon = link.icon;
      a.innerHTML = `<span class="site-icon">${escapeHtml([...link.name][0]?.toUpperCase() || "↗")}${icon ? `<img src="${escapeHtml(icon)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ""}</span><span class="card-copy"><strong>${escapeHtml(link.name)}</strong><small>${escapeHtml(link.description || hostname(link.url))}</small></span><span class="arrow">↗</span>`;
      cards.append(a);
    });
    groupFragment.append(node);
    const jump = document.createElement("a");
    jump.href = `#${groupId}`;
    jump.title = group.name;
    jump.innerHTML = `<span style="color:${escapeHtml(group.color || "#8692ff")};background:${escapeHtml(group.color || "#8692ff")}22">${escapeHtml(group.icon || "◆")}</span><b>${escapeHtml(group.name)}</b>`;
    railFragment.append(jump);
  });
  navigation.replaceChildren(groupFragment);
  categoryRail.replaceChildren(railFragment);
  if (!visibleGroups) navigation.innerHTML = '<div class="empty"><span>◌</span><h2>这里还没有导航链接</h2><p>前往管理页，添加你的第一个链接。</p><a href="/admin/">打开管理页</a></div>';
}

function showLogin(message = "") {
  app.hidden = true;
  loginScreen.hidden = false;
  $("#loginMessage").textContent = message;
  performance.mark("navdesk-login-ready");
}

function showNavigation(data) {
  loginScreen.hidden = true;
  app.hidden = false;
  bootScreen.hidden = true;
  setBrand(data.settings);
  render(data);
  performance.mark("navdesk-content-ready");
}

async function initialise(first = false) {
  bootScreen.hidden = false;
  $("#retryButton").hidden = true;
  $("#bootMessage").textContent = "正在打开导航…";
  try {
    const result = first ? await window.navdeskBoot.navigation : { data: await request("/api/navigation") };
    if (result.error) throw result.error;
    showNavigation(result.data);
  } catch (error) {
    if (error.status === 401) { showLogin(); return; }
    $("#bootMessage").textContent = "暂时无法读取导航，请检查网络后重试。";
    $("#retryButton").hidden = false;
  }
}

formatClock();
setInterval(() => { if (!document.hidden) formatClock(); }, 60_000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) formatClock(); });
$("#themeButton").onclick = () => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light");
$("#retryButton").onclick = () => initialise();
document.addEventListener("keydown", event => {
  if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); $("#searchInput").focus(); }
});

$("#loginForm").onsubmit = async (event) => {
  event.preventDefault();
  const button = $("button", event.currentTarget);
  button.disabled = true;
  button.innerHTML = "正在验证…";
  $("#loginMessage").textContent = "";
  try {
    await request("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: $("#password").value }) });
    const data = await request("/api/navigation", { cache: "no-store" });
    $("#password").value = "";
    showNavigation(data);
  } catch (error) {
    $("#loginMessage").textContent = error.message || "登录失败，请稍后重试。";
  } finally {
    button.disabled = false;
    button.innerHTML = `进入 <span id="loginBrandName">${escapeHtml($("#brandName").textContent)}</span> <span>→</span>`;
  }
};

$("#webSearchForm").onsubmit = (event) => {
  event.preventDefault();
  const query = $("#searchInput").value.trim();
  if (!query) return $("#searchInput").focus();
  const engine = $("#searchEngine").value;
  write("navdesk-search-engine", engine);
  window.open(`${searchUrls[engine] || searchUrls.google}${encodeURIComponent(query)}`, "_blank", "noopener");
};
$("#searchEngine").value = read("navdesk-search-engine") || "google";
performance.mark("navdesk-shell-ready");
initialise(true);
</script>
<noscript><p>请启用 JavaScript 以登录并读取私有导航。</p></noscript>
</body>
